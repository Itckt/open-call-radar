<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="搜尋香港創作比賽與徵件，按學校、類別、費用和截止日篩選。收藏機會、記錄準備進度，將截止日期加入日曆。">
  <meta name="theme-color" content="#cf347d">
  <title>Open Call 雷達 HK — 搵機會，開始創作</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23cf347d'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M32 32L47 17' stroke='white' stroke-width='3'/%3E%3Ccircle cx='22' cy='39' r='4' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#results-heading">跳到搜尋結果</a>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Open Call 雷達首頁">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="9"/><path d="M20 20 32 8"/><circle class="blip" cx="12" cy="27" r="3"/></svg>
        <span>Open Call <strong>雷達</strong><small>HK</small></span>
      </a>
      <div class="top-actions">
        <nav class="view-tabs" aria-label="主要頁面">
          <button type="button" data-view="explore" aria-pressed="true">搵機會</button>
          <button type="button" data-view="saved" aria-pressed="false">我的清單 <span id="saved-count">0</span></button>
        </nav>
        <button type="button" class="icon-button theme-toggle" id="theme-toggle" aria-label="切換深色模式" title="切換深色模式"></button>
      </div>
    </header>
    <main>
      <section class="search-space" aria-labelledby="page-title">
        <div class="intro">
          <div><p class="eyebrow">FOR YOUR NEXT CREATION</p><h1 id="page-title">搵你嘅下一個機會<span class="pink-dot">。</span></h1></div>
          <p class="intro-caption" id="intro-caption">比賽 · 徵件 · 展覽<br><span>留返時間，俾創作。</span></p>
        </div>
        <form id="search-form" class="search" role="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="q" type="search" placeholder="試吓「HKBU 免費 攝影」" aria-label="搜尋比賽、類別或學校" autocomplete="off" spellcheck="false" maxlength="160" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
          <button type="button" id="clear-search" class="icon-button" aria-label="清除搜尋" hidden>×</button>
          <kbd aria-hidden="true">/</kbd>
          <div class="suggestions" id="suggestions" role="listbox" aria-label="搜尋建議" hidden></div>
        </form>
        <div id="filters" class="filters" aria-label="篩選機會">
          <label class="select-control"><span>對象</span><select id="profile" aria-label="學段或學校">
            <option value="all">全部對象</option><option value="tertiary">大專生</option><option value="secondary">中學生</option><option value="primary">小學生</option>
            <optgroup label="我的院校"><option value="HKBU">HKBU 浸大</option><option value="HKU">HKU 港大</option><option value="CUHK">CUHK 中大</option><option value="HKUST">HKUST 科大</option><option value="PolyU">PolyU 理大</option><option value="CityU">CityU 城大</option><option value="LingU">LingU 嶺大</option><option value="EdUHK">EdUHK 教大</option><option value="HKMU">HKMU 都大</option><option value="HKDI">HKDI 知專</option><option value="HKAPA">HKAPA 演藝</option></optgroup>
          </select></label>
          <label class="select-control"><span>截止</span><select id="days" aria-label="截止日期範圍"><option value="0">全部日期</option><option value="7">7 日內</option><option value="30">30 日內</option><option value="90">90 日內</option></select></label>
          <button type="button" class="toggle-button" id="free-filter" aria-pressed="false"><span class="toggle-check" aria-hidden="true"></span>只睇免費</button>
          <button type="button" class="text-button" id="reset-filters" hidden>重設篩選</button>
        </div>
        <p class="scope-note" id="scope-note" hidden></p>
      </section>
      <div class="category-row" id="categories" aria-label="創作類別"></div>
      <div class="notice" id="data-notice" role="status" hidden></div>
      <section class="workspace" aria-labelledby="results-heading">
        <div class="results-toolbar">
          <div class="result-heading-wrap"><h2 id="results-heading" tabindex="-1">正在開放</h2><span class="result-count" id="result-count"></span></div>
          <div class="result-actions">
            <label class="sort-control"><span class="sr-only">排序</span><select id="sort"><option value="deadline">最近截止</option><option value="relevance">最相關</option><option value="later">較多準備時間</option></select></label>
            <button type="button" class="icon-button share-button" id="share-search" aria-label="複製搜尋連結" title="分享搜尋"></button>
          </div>
        </div>
        <div class="saved-tools" id="saved-tools" hidden>
          <p>收藏、進度同筆記，只保留喺呢個瀏覽器。</p>
          <div><button type="button" class="text-button" id="export-calendar">匯出未截止日曆</button><button type="button" class="text-button" id="export-backup">備份清單</button><button type="button" class="text-button" id="import-backup">匯入備份</button><input type="file" id="backup-file" accept=".json,application/json" hidden></div>
        </div>
        <p class="sr-only" id="result-announcement" aria-live="polite" aria-atomic="true"></p>
        <div class="card-grid" id="competitions" aria-busy="true">
          <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
        </div>
        <button type="button" class="more-button" id="more" hidden>睇更多機會</button>
      </section>
      <section class="sources-section" id="sources-section" hidden aria-labelledby="sources-title">
        <details id="sources-details">
          <summary><span id="sources-title">相關主辦網站</span><span id="source-count"></span><span class="chevron" aria-hidden="true"></span></summary>
          <div class="source-grid" id="sources"></div>
        </details>
      </section>
      <footer class="footer"><span>Open Call 雷達 HK</span><span>截止日期及時間：香港 UTC+8</span><a href="https://github.com/Itckt/open-call-radar" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-undo" hidden>復原</button></div>
  <dialog id="share-dialog" aria-labelledby="share-title"><h2 id="share-title">分享呢個搜尋</h2><p>複製連結，其他人會見到相同篩選。</p><input id="share-url" aria-label="搜尋連結" readonly><form method="dialog"><button class="primary-button">完成</button></form></dialog>
  <noscript><p class="noscript">請開啟 JavaScript，先可以搜尋比賽同管理清單。</p></noscript>
</body>
</html>
